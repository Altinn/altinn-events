info:
  name: app event (apps-test)
  type: http
  seq: 1

http:
  method: POST
  url: "{{PlatformHostUrl}}/events/api/v1/app"
  headers:
    - name: Content-Type
      value: application/cloudevents+json
    - name: PlatformAccessToken
      value: "{{AccessToken}}"
  body:
    type: json
    data: |-
      {
        "specversion": "1.0",
        "time": "{{$isoTimestamp}}",
        "type": "app.instance.created",
        "source": "https://ttd.apps.at22.altinn.cloud/ttd/apps-test/instances/50019855/428a4575-2c04-4400-89a3-1aaadd2579cd",
        "subject": "/party/51282358",
        "alternativesubject": "/org/311085972"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        await bru.runRequest("Token generator/access token (ttd_apps-test)")
        await bru.runRequest("Token generator/publish (ttd)")

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
