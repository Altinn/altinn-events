info:
  name: publish admin (dialogporten)
  type: http
  seq: 4

http:
  method: GET
  url: "{{TokenGeneratorBaseUrl}}/api/GetEnterpriseToken?env={{Environment}}&scopes=altinn:events.publish altinn:events.publish.admin&orgNo=991825827&org=ttd"
  params:
    - name: env
      value: "{{Environment}}"
      type: query
    - name: scopes
      value: altinn:events.publish altinn:events.publish.admin
      type: query
    - name: orgNo
      value: "991825827"
      type: query
    - name: org
      value: ttd
      type: query
  auth:
    type: basic
    username: "{{TokenGeneratorUserName}}"
    password: "{{TokenGeneratorPassword}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody();
        bru.setVar("BearerToken", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
