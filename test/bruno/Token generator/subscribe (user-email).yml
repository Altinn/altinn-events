info:
  name: subscribe (user-email)
  type: http
  seq: 3

http:
  method: GET
  url: "{{TokenGeneratorBaseUrl}}/api/GetSelfRegisteredEmailUserToken?env={{Environment}}&scopes=altinn:events.subscribe&userId={{AuthN_UserId}}&partyId={{AuthN_PartyId}}&email={{AuthN_Email}}"
  params:
    - name: env
      value: "{{Environment}}"
      type: query
    - name: scopes
      value: altinn:events.subscribe
      type: query
    - name: userId
      value: "{{AuthN_UserId}}"
      type: query
    - name: partyId
      value: "{{AuthN_PartyId}}"
      type: query
    - name: email
      value: "{{AuthN_Email}}"
      type: query
  auth:
    type: basic
    username: "{{TokenGeneratorUserName}}"
    password: "{{TokenGeneratorPassword}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody();
        bru.setVar("BearerToken", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
